[project]
name = "discovery"
version = "0.1.0"
description = "Appadino Discovery — nonprofit prospect discovery pipeline"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Deflate64 decoder: IRS TEOS XML archives use ZIP method 9 from 2025_05A on
    "inflate64>=1.0.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
markers = [
    "integration: needs a real local Postgres via Docker or local initdb/pg_ctl; skipped when neither is available",
]
